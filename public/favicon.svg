  </defs>

  <!-- Brand Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#kok-bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

