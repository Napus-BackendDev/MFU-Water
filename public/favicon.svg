      <stop offset="55%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="kok-drop" x1="32" y1="12" x2="32" y2="50" gradientUnits="userSpaceOnUse">
